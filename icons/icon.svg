  <circle cx="256" cy="268" r="176" fill="url(#gold)"/>
  <circle cx="256" cy="268" r="176" fill="none" stroke="#b86a00" stroke-width="10"/>
  <circle cx="256" cy="268" r="138" fill="url(#gold2)" stroke="#c97c00" stroke-width="6"/>
  <g fill="#b86a00">
