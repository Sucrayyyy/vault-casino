  <circle cx="214" cy="230" r="17" fill="#1b1033"/><circle cx="314" cy="230" r="17" fill="#1b1033"/>
  <circle cx="221" cy="222" r="6" fill="#fff"/><circle cx="321" cy="222" r="6" fill="#fff"/>
  <ellipse cx="166" cy="290" rx="20" ry="12" fill="#ff7a59" opacity=".55"/><ellipse cx="346" cy="290" rx="20" ry="12" fill="#ff7a59" opacity=".55"/>
